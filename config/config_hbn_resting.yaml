# HBN 静息态 eyes-open aperiodic exponent（128/129 导 EGI）
# Nuclear 极限去噪管线：EO 边缘切除 → 2s Epoch → AutoReject → CSD → Welch PSD → specparam(knee)
project:
  name: "hbn_resting_eo_exponent_nuclear"
  random_seed: 42

paths:
  # ---------------------------------------------------------------------------
  # PATH PLACEHOLDERS (relative to repository root; raw EEG / HBN BIDS not shipped)
  # To use local data, either:
  #   (1) place files under the relative folders below, or
  #   (2) replace with your own absolute paths LOCALLY (do not commit them), e.g.
  #         raw_data: "/PATH/TO/YOUR/RAW_EEG"
  #         bids_root: "/PATH/TO/HBN_BIDS"
  # See config/README_PATHS.md
  # ---------------------------------------------------------------------------
  bids_root: "data/hbn_manifest_A_data"  # PLACEHOLDER: HBN BIDS root (obtain under HBN DUA)
  manifest_file: "data/hbn_metadata/hbn_eeg_bids_scan.csv"  # PLACEHOLDER: HBN inclusion / scan manifest
  participants_file: "data/hbn_external/participants.csv"  # PLACEHOLDER: de-identified participant table
  derivatives_root: "derivatives/hbn_nuclear"  # created at runtime / optional local intermediates
  outputs_root: "outputs/hbn_nuclear"  # analysis tables & figures
  logs_dir: "derivatives/hbn_nuclear/logs"  # log directory

eeg:
  system: "EGI HydroCel GSN-129"
  default_format: "set"
  montage: "GSN-HydroCel-128"
  channel_naming: "E"
  original_sfreq_hz: 500
  exclude_channels:
    - VREF
    - Cz
    - E129
  keep_channels_eeg: "E1-E128"
  sampling_rate_target: 250

filter:
  highpass_hz: 0.5
  lowpass_hz: 45.0
  notch_hz: 60.0
  notch_enabled: true

reference:
  method: "average"

epochs:
  duration_sec: 2.0
  overlap_sec: 0.0

# ---------------------------------------------------------------------------
# Nuclear 极限去噪模块（AutoReject + CSD + specparam knee）
# ---------------------------------------------------------------------------
nuclear:
  enabled: true
  autoreject:
    n_jobs: -1
    random_state: 42
    verbose: false
  csd:
    enabled: true
    # 按顺序尝试，直到有足够通道匹配到标准坐标
    montage_candidates:
      - "GSN-HydroCel-128"
      - "GSN-HydroCel-129"
    min_matched_channels: 64
  min_epochs_after_autoreject: 10

psd:
  freq_min_hz: 1.0
  freq_max_hz: 40.0
  welch:
    n_fft: 500
    n_overlap: 250
    window: "hamming"
    fmin: 1.0
    fmax: 40.0

specparam:
  freq_range: [1.0, 40.0]
  peak_width_limits: [1.0, 8.0]
  max_n_peaks: 6
  min_peak_height: 0.1
  peak_threshold: 2.0
  aperiodic_mode: "knee"
  verbose: false

hbn:
  eyes_open_patterns:
    - "instructed_toOpenEyes"
    - "eyes open"
    - "eyes_open"
    - "EO"
  eo_fallback_duration_sec: 20.0
  eo_trim_start_sec: 2.0
  eo_trim_end_sec: 1.0
  eo_min_segment_sec: 0.5
  roi_channels:
    - E67
    - E72
    - E75
    - E77
  roi_config: "config/roi_channels_hbn129.yaml"
  roi_layout: "channels_hbn129"

groups:
  asd_label: "ASD"
  td_label: "TD"

processing:
  overwrite: false
