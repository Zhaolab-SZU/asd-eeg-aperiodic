# =============================================================================
# HBN ThePresent（自然观看 movie）— 预处理 / ISC 探索
# =============================================================================

project:
  name: "hbn_thepresent_movie"
  random_seed: 42

paths:
  # ---------------------------------------------------------------------------
  # PATH PLACEHOLDERS (relative to repository root; raw EEG / HBN BIDS not shipped)
  # To use local data, either:
  #   (1) place files under the relative folders below, or
  #   (2) replace with your own absolute paths LOCALLY (do not commit them), e.g.
  #         raw_data: "/PATH/TO/YOUR/RAW_EEG"
  #         bids_root: "/PATH/TO/HBN_BIDS"
  # See config/README_PATHS.md
  # ---------------------------------------------------------------------------
  bids_root: "data/hbn_manifest_A_data"  # PLACEHOLDER: HBN BIDS root (obtain under HBN DUA)
  manifest_file: "outputs/hbn_manifest/manifest_A_strict_main_replication.csv"  # PLACEHOLDER: HBN inclusion / scan manifest
  participants_file: "data/hbn_external/participants_thepresent.csv"  # PLACEHOLDER: de-identified participant table
  derivatives_root: "derivatives/hbn_external_movie"  # created at runtime / optional local intermediates
  outputs_root: "outputs/hbn_external_movie"  # analysis tables & figures
  logs_dir: "derivatives/hbn_external_movie/logs"  # log directory

hbn:
  thepresent:
    video_start_patterns:
      - "video_start"
    video_stop_patterns:
      - "video_stop"
    fallback_duration_sec: 206.0
  skip_ica: true
  roi_layout: "channels_hbn129"
  roi_config: "config/roi_channels_hbn129.yaml"
  main_matched:
    age_min_months: 40
    age_max_months: 131
    min_usable_epochs: 40
    td_scq_max: 11
    td_srs_max: 65
    match_caliper_age_months: 12
    match_caliper_iq: 15
    require_same_sex: true

eeg:
  system: "HBN 129-channel EGI"
  default_format: "set"
  keep_channels_eeg: "E1-E128"
  exclude_channels:
    - E129
    - VREF
    - Cz
  original_sfreq_hz: 500
  task_condition: "movie"
  sampling_rate_target: 250

filter:
  highpass_hz: 0.5
  lowpass_hz: 45.0
  notch_hz: 60.0
  notch_enabled: true

reference:
  method: "average"

epochs:
  duration_sec: 2.0
  overlap_sec: 0.0
  min_usable_epochs: 40   # ~80 s；全片约 100 epoch
  reject_amplitude_uv: 500.0

psd:
  freq_min_hz: 1.0
  freq_max_hz: 40.0
  welch:
    n_fft: 500
    n_overlap: 250
    window: "hamming"
    fmin: 1.0
    fmax: 40.0

specparam:
  freq_range: [1.0, 40.0]
  peak_width_limits: [1.0, 8.0]
  max_n_peaks: 6
  min_peak_height: 0.1
  peak_threshold: 2.0
  aperiodic_mode: "fixed"
  verbose: false

fit_quality:
  min_r_squared: 0.90
  exponent_min: 0.0
  exponent_max: 5.0
  fit_error_top_percentile: 5.0
  subject_invalid_channel_ratio_max: 0.20

groups:
  asd_label: "ASD"
  td_label: "TD"

processing:
  n_jobs: 1
  overwrite: false
