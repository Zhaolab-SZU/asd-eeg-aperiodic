# =============================================================================
# HBN-EEG 外部复现 — 独立 pipeline 配置（与主研究 derivatives 隔离）
# =============================================================================

project:
  name: "hbn_external_replication"
  random_seed: 42

paths:
  # ---------------------------------------------------------------------------
  # PATH PLACEHOLDERS (relative to repository root; raw EEG / HBN BIDS not shipped)
  # To use local data, either:
  #   (1) place files under the relative folders below, or
  #   (2) replace with your own absolute paths LOCALLY (do not commit them), e.g.
  #         raw_data: "/PATH/TO/YOUR/RAW_EEG"
  #         bids_root: "/PATH/TO/HBN_BIDS"
  # See config/README_PATHS.md
  # ---------------------------------------------------------------------------
  bids_root: "data/hbn_manifest_A_data"  # PLACEHOLDER: HBN BIDS root (obtain under HBN DUA)
  manifest_file: "outputs/hbn_manifest/manifest_A_strict_main_replication.csv"  # PLACEHOLDER: HBN inclusion / scan manifest
  participants_file: "data/hbn_external/participants.csv"  # PLACEHOLDER: de-identified participant table
  derivatives_root: "derivatives/hbn_external"  # created at runtime / optional local intermediates
  outputs_root: "outputs/hbn_external"  # analysis tables & figures
  logs_dir: "derivatives/hbn_external/logs"  # log directory

hbn:
  # RestingState events 中 eyes-open 标签
  eyes_open_patterns:
    - "instructed_toOpenEyes"
    - "eyes-open"
    - "eyes open"
  eyes_closed_patterns:
    - "instructed_toCloseEyes"
    - "eyes-closed"
    - "eyes closed"
  eo_fallback_duration_sec: 20.0
  skip_ica: true  # 外部复现默认跳过 ICA（HBN 已预处理 BIDS）
  roi_layout: "channels_hbn129"
  roi_config: "config/roi_channels_hbn129.yaml"
  replication:
    primary_age_min_months: 72
    primary_age_max_months: 131
    age_split_months: 72
    primary_roi: "homologous_four"
  # 108 主研究对齐筛选（见 main_matched_replication_report_zh.md）
  main_matched:
    age_min_months: 40
    age_max_months: 131
    min_usable_epochs: 42        # 主研究 60；HBN EO 中位 ~47
    td_scq_max: 11
    td_srs_max: 65
    match_caliper_age_months: 12
    match_caliper_iq: 15
    require_same_sex: true
  # 109 严格四步复现（posterior ROI + group×age primary target）
  strict_replication:
    phenotype_merged: "data/hbn_metadata/hbn_subject_phenotype_merged.csv"  # PLACEHOLDER: HBN phenotype table (local)
    age_min_months: 60          # 5 岁
    age_max_months: 120          # 10 岁
    male_only: true
    iq_min: 80
    td_scq_max: 11
    td_srs_max: 65
    min_usable_epochs: 46        # HBN EO 高分位（主研究 60 不可达）
    max_invalid_channel_ratio: 0.05
    emg_ratio_max_quantile: 0.75
    posterior_min_r_squared: 0.95
    posterior_max_fit_error: 0.04
    posterior_min_strict_channels: 3
    require_posterior_strict_pass: true
  # 110 维度化验证（症状关联 + 表型富集，不依赖 ADOS）
  dimensional_replication:
    phenotype_merged: "data/hbn_metadata/hbn_subject_phenotype_merged.csv"  # PLACEHOLDER: HBN phenotype table (local)
    age_min_months: 60
    age_max_months: 120
    male_only: true
    iq_min: 80
    min_usable_epochs: 42
    asd_srs_min: 60          # 富集：社交症状抬高
    asd_scq_min: 11
    td_srs_max: 65
    td_scq_max: 11
    match_caliper_age_months: 12
    match_caliper_iq: 15
    require_same_sex: true

eeg:
  system: "HBN 129-channel EGI"
  default_format: "set"
  keep_channels_eeg: "E1-E128"
  exclude_channels:
    - E129
    - VREF
    - Cz
  original_sfreq_hz: 500
  resting_condition: "eyes_open"
  sampling_rate_target: 250

filter:
  highpass_hz: 0.5
  lowpass_hz: 45.0
  notch_hz: 60.0
  notch_enabled: true

reference:
  method: "average"

epochs:
  duration_sec: 2.0
  overlap_sec: 0.0
  min_usable_epochs: 20   # HBN 多段 20s EO；全量约 60 epoch 上限
  reject_amplitude_uv: 500.0

psd:
  freq_min_hz: 1.0
  freq_max_hz: 40.0
  welch:
    n_fft: 500
    n_overlap: 250
    window: "hamming"
    fmin: 1.0
    fmax: 40.0

specparam:
  freq_range: [1.0, 40.0]
  peak_width_limits: [1.0, 8.0]
  max_n_peaks: 6
  min_peak_height: 0.1
  peak_threshold: 2.0
  aperiodic_mode: "fixed"
  verbose: false

fit_quality:
  min_r_squared: 0.90
  exponent_min: 0.0
  exponent_max: 5.0
  fit_error_top_percentile: 5.0
  subject_invalid_channel_ratio_max: 0.20

groups:
  asd_label: "ASD"
  td_label: "TD"

processing:
  n_jobs: 1
  overwrite: false

# 通道级空间统计（105）— 无预设 ROI
spatial_stats:
  montage: "GSN-HydroCel-128"
  n_permutations: 5000
  cluster_forming_threshold: 2.0   # mass-univariate t 阈值
  mixed_model: true
  tfce:
    enabled: true
    start: 2.0
    step: 0.2
    h_power: 2.0
    e_power: 0.5
  # 111 症状维度空间统计
  symptom:
    n_permutations: 2000
    cohorts:
      - full_sample
      - enriched
    symptoms:
      - SRS_total
      - SCQ_total

  # 112 一阶–三阶增补
  tier_augmentation:
    skip_temporal: false
