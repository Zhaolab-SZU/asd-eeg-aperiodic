name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manuscript-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Import smoke + number lock
        run: python -m pytest
